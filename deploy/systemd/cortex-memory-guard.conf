# Install as /etc/systemd/system/cortex.service.d/20-memory-guard.conf.
# The allocator settings fix retained native Chroma/ONNX heap arenas. The
# cgroup limits are a last-resort recovery boundary, not the primary fix.
[Service]
Environment=MALLOC_ARENA_MAX=2
Environment=MALLOC_TRIM_THRESHOLD_=131072
Environment=MALLOC_TOP_PAD_=131072

# Normal post-warmup Cortex RSS is well below 1 GiB with the allocator fix.
# Throttle a regression before it can stall CT101, and restart Cortex alone if
# it crosses the hard boundary. Restart=always is set by cortex.service.
MemoryHigh=2G
MemoryMax=3G
MemorySwapMax=512M
OOMPolicy=stop
