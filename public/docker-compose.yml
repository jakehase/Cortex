          echo "Cortex external application-state continuity manifest is missing or mismatched" >&2
          exit 1
        fi
        if [ ! -e "$$marker" ]; then
          echo "Cortex application-state marker is missing; refusing blank replacement volume (run explicit bootstrap, source adoption, or restore)" >&2
          exit 1
        fi
        if [ ! -f "$$marker" ] || [ -L "$$marker" ]; then
          echo "Cortex application-state marker must be a regular non-symlink file" >&2
