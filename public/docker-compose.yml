    image: rhasspy/wyoming-piper:2.2.2@sha256:c874e4a04657ae3381332ee5d0c8c70a310dae6722892840f530ac0890b44eb3
    container_name: piper-tts
    ports:
      - "10200:10200"
    volumes:
      - ./piper-data:/data:rw
    restart: unless-stopped
    networks:
      - cortex-network
    command: --voice en_US-lessac-medium --uri tcp://0.0.0.0:10200 --download-dir /data

