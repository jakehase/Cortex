    command:
      - /bin/sh
      - -ec
      - |
        marker=/reasoning/.cortex-durable-reasoning
        authority=/reasoning/.cortex-reasoning-authority
        database=/reasoning/reasoning_runtime.db
        expected=/continuity/cortex-reasoning.volume-id
        completion=/continuity/cortex-volume-set.complete
        if [ ! -f "$$completion" ] || [ -L "$$completion" ] || [ "$$(cat "$$completion")" != "cortex.volume-set.v1" ]; then
