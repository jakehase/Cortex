          exit 1
        fi
        if [ ! -s "$$expected" ] || [ "$$(cat "$$expected")" != "$$CORTEX_REASONING_MOUNT_ID" ]; then
          echo "Cortex external reasoning continuity manifest is missing or mismatched" >&2
          exit 1
        fi
        if [ ! -e "$$marker" ]; then
          echo "Cortex reasoning marker is missing; refusing blank replacement volume (run explicit bootstrap, source adoption, or restore)" >&2
          exit 1
        fi
        if [ ! -f "$$marker" ] || [ -L "$$marker" ]; then
          echo "Cortex reasoning marker must be a regular non-symlink file" >&2
          exit 1
        fi
        if [ "$$(cat "$$marker")" != "$$CORTEX_REASONING_MOUNT_ID" ]; then
          echo "Cortex reasoning volume identity mismatch" >&2
          exit 1
        fi
        if [ ! -f "$$authority" ] || [ -L "$$authority" ] || \
          [ "$$(cat "$$authority")" != "cortex.reasoning-authority.v1:$$CORTEX_REASONING_MOUNT_ID:reasoning_runtime.db" ]; then
          echo "Cortex reasoning authority sentinel is missing or mismatched; restore the authority instead of recreating it" >&2
          exit 1
        fi
        if [ ! -f "$$database" ] || [ -L "$$database" ]; then
          echo "Cortex reasoning database is missing; restore it instead of initializing during startup" >&2
          exit 1
        fi
        chmod 0700 /reasoning
        chmod 0600 "$$marker" "$$authority" "$$database"
        sync /reasoning
    restart: "no"

